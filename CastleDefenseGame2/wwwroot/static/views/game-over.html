<link rel="stylesheet" href="./static/views/view-styles/game-over.css">

<div id="game-over" class="ui-screen">   
    <div>
        <h1 id="game-over-title">P WINS!!!</h1>
        <!-- Only shown when the game was awarded rather than played out. A SEPARATE SMALL
             LINE rather than a longer h1: at 3rem the pixel font is ~41px per character, so
             "P1 WINS BY DEFAULT" is 742px of an 812px landscape phone -- and a second h1
             line costs 47px of height, which is the dimension this screen has least of. -->
        <p id="game-over-note" class="hidden">OPPONENT DISCONNECTED</p>
        <div class="lobby-id-wrapper">
            <h3>GAME ID:</h3>
            <div class="id-display-box" id="game-over-id-text">------</div>
            <button id="btnCopyGameId" class="button">Copy</button>
        </div>
        <div id="game-over-stats-wrapper">
            <div id="game-time">Game Time: 00:00</div>
            <div class="stats-column" id="p1-stats">

            </div>
            <div class="stats-column" id="p2-stats">

            </div>
        </div>
        <button id="btnMainMenu">Main Menu</button>
    </div>
</div>

<link rel="stylesheet" href="./static/views/view-styles/select-level.css">

<div id="select-team" class="ui-screen">
    <h1>CHOOSE YOUR OPPONENT:</h1>
    <div id="team-bar">
        <div class="team" id="white"  style="background-color: white"></div>
        <div class="team" id="purple" style="background-color: purple"></div>
        <div class="team" id="blue"   style="background-color: blue"  ></div>
        <div class="team" id="green"  style="background-color: green" ></div>
        <div class="team" id="yellow" style="background-color: yellow"></div>
        <div class="team" id="orange" style="background-color: orange"></div>
        <div class="team" id="red"    style="background-color: red"   ></div>
        <div class="team" id="black"  style="background-color: black" ></div>
    </div>
    <h2>CHOOSE YOUR LEVEL:</h2>
    <div id="level-bar">
        <div class="level" id="1">1</div>
        <div class="level" id="2">2</div>
        <div class="level" id="3">3</div>
        <div class="level" id="4">4</div>
        <div class="level" id="5">5</div>
        <div class="level" id="6">6</div>
        <div class="level" id="7">7</div>
        <div class="level" id="8">8</div>
        <div class="level" id="antispam">AntiSpam</div>
    </div>
    <div id="model-picker" class="d-none">
        <h2>OR PLAY A SPECIFIC TRAINED MODEL:</h2>
        <select id="model-select">
            <option value="">(none -- use tier/AntiSpam above)</option>
        </select>
    </div>

    <div>
        <button id="btnBack">Back</button>
        <button id="btnSelect">Start Game!</button>
    </div>
</div>

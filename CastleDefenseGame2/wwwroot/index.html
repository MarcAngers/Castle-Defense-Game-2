<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Battle Pets 2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <script type="module" src="script.js"></script>
    <link rel="stylesheet" href="global-styles.css">
</head>
<body>
    <canvas id="bgCanvas"></canvas>
    <div id="app-container"></div>

    <!-- Rejoin prompt. Lives here rather than in a view because the whole point is that it
         survives a page reload and can appear over whatever screen the router has put up.
         Hidden until reconnect-ui.js finds a live game waiting for this browser. -->
    <div id="rejoin-prompt" class="hidden">
        <div class="rejoin-box">
            <h2>GAME IN PROGRESS</h2>
            <!-- Message and id are separate elements on purpose: the message is rewritten
                 at runtime ("Rejoining...", "Connection lost."), which would take the id
                 span with it if they shared a node. -->
            <p id="rejoin-message">You were disconnected.</p>
            <p class="rejoin-id">GAME <span id="rejoin-game-id">------</span></p>
            <p class="rejoin-countdown"><span id="rejoin-timer">60</span>s TO REJOIN</p>
            <div class="rejoin-buttons">
                <button id="btnRejoinGame">Rejoin</button>
                <button id="btnAbandonGame">Abandon</button>
            </div>
        </div>
    </div>

    <!-- Portrait lock. Purely CSS-driven (see global-styles.css): shown by a media query
         on touch devices held in portrait, hidden the moment the device is rotated. -->
    <div id="rotate-prompt">
        <div>
            <svg id="rotate-icon" viewBox="0 0 64 64" aria-hidden="true">
                <rect x="22" y="6" width="20" height="36" rx="3"/>
                <line x1="28" y1="11" x2="36" y2="11"/>
            </svg>
            <h2>ROTATE YOUR DEVICE</h2>
            <p>Super Battle Pets 2 is played in landscape.</p>
        </div>
    </div>
</body>
</html>
